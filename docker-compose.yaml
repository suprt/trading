services:
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: trading-user-service
    ports:
      - "50051:50051"
    env_file:
      - user-service/.env
    environment:
      POSTGRES_DSN: "postgres://trading:trading@postgres-user:5432/user_db?sslmode=disable"
      TRACING_ENDPOINT: "otel-collector:4317"
      TRACING_SERVICE_NAME: "user-service"
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  spot-service:
    build:
      context: .
      dockerfile: spot-service/Dockerfile
    container_name: trading-spot-service
    ports:
      - "50052:50052"
    env_file:
      - spot-service/.env
    environment:
      POSTGRES_DSN: "postgres://trading:trading@postgres-spot:5432/spot_db?sslmode=disable"
      USER_SERVICE_ADDR: "user-service:50051"
      TRACING_ENDPOINT: "otel-collector:4317"
      TRACING_SERVICE_NAME: "spot-service"
    depends_on:
      postgres-spot:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
    restart: unless-stopped
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: trading-order-service
    ports:
      - "50053:50053"
    env_file:
      - order-service/.env
    environment:
      POSTGRES_DSN: "postgres://trading:trading@postgres-order:5432/order_db?sslmode=disable"
      USER_SERVICE_ADDR: "user-service:50051"
      SPOT_SERVICE_ADDR: "spot-service:50052"
      TRACING_ENDPOINT: "otel-collector:4317"
      TRACING_SERVICE_NAME: "order-service"
    depends_on:
      postgres-order:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      spot-service:
        condition: service_started
    restart: unless-stopped
  redis:
    image: redis:8.10.2-alpine
    command: >
      redis-server
      --user default off
      --user ${REDIS_USER:-redis_user} on ">${REDIS_PASSWORD:-redis_password}" "~*" "+@all"
    container_name: trading-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-user:
    image: postgres:16-alpine
    container_name: trading-postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres-spot:
    image: postgres:16-alpine
    container_name: trading-postgres-spot
    environment:
      POSTGRES_DB: spot_db
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
    ports:
      - "5433:5432"
    volumes:
      - postgres_spot_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d spot_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres-order:
    image: postgres:16-alpine
    container_name: trading-postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d order_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  tempo:
    image: grafana/tempo:2.10.4
    container_name: trading-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP (для Grafana)
      - "4317:4317"   # OTLP gRPC (приём трейсов)
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: trading-otel-collector
    command: [ "--config=/etc/otel-collector.yaml" ]
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otel-collector.yaml
    ports:
      - "4319:4317"   # OTLP gRPC (сюда шлют приложения; 4317 занят Tempo)
      - "4320:4318"   # OTLP HTTP
    depends_on:
      - tempo
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: trading-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo
    restart: unless-stopped


volumes:
  postgres_user_data:
  postgres_spot_data:
  postgres_order_data:
  redis_data:
  tempo_data:
  grafana_data:
