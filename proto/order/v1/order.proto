syntax = "proto3";

package order.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/suprt/trading/proto/order/v1;order_v1";

// Определяем направление заказа
enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

// Определяет тип сделки: Limit - покупка не выше указанной цены; Market - покупка по наименьшей цене на рынке
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}


enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_FILLED = 2;
  ORDER_STATUS_CANCELLED = 3;
  ORDER_STATUS_REJECTED = 4;
}

message Order {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  string market_id = 3 [(buf.validate.field).string.uuid = true];
  OrderSide side = 4;
  OrderType type = 5;
  int64 price = 6;
  int64 quantity = 7;
  OrderStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc GetOrderStatus(GetOrderStatusRequest) returns (GetOrderStatusResponse);
  rpc AdminGetOrder(AdminGetOrderRequest) returns (AdminGetOrderResponse);
  rpc AdminGetOrderStatus(AdminGetOrderStatusRequest) returns (AdminGetOrderStatusResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc AdminCancelOrder(AdminCancelOrderRequest) returns (AdminCancelOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc AdminListOrders(AdminListOrdersRequest) returns (AdminListOrdersResponse);
}

message CreateOrderRequest{
  string market_id = 1 [(buf.validate.field).string.uuid = true];
  OrderSide side = 2[
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  OrderType type = 3 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  optional int64 price = 4; // При type = Market передавать цену не требуется
  int64 quantity = 5 [(buf.validate.field).int64.gt = 0];
}

message CreateOrderResponse{
  Order order = 1;
}

message GetOrderRequest{
  string order_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetOrderResponse{
  Order order = 1;
}

message GetOrderStatusRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetOrderStatusResponse {
  string order_id = 1;
  OrderStatus status = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message AdminGetOrderRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
}

message AdminGetOrderResponse{
  Order order = 1;
}

message AdminGetOrderStatusRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
}

message AdminGetOrderStatusResponse {
  string order_id = 1;
  OrderStatus status = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message CancelOrderRequest{
  string order_id = 1 [(buf.validate.field).string.uuid = true];
}

message CancelOrderResponse{
  Order order = 1;
}

message AdminCancelOrderRequest{
  string order_id = 1 [(buf.validate.field).string.uuid = true];
}

message AdminCancelOrderResponse {
  Order order = 1;
}

message ListOrdersRequest{
  int32 page_size =1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string page_token = 2 [(buf.validate.field).string.max_len=256];
}

message ListOrdersResponse{
  repeated Order orders = 1;
  string next_page_token = 2;
}

message AdminListOrdersRequest {
  optional string user_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size =2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  string page_token = 3 [(buf.validate.field).string.max_len=256];
}

message AdminListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

