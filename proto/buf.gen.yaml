version: v2

clean: true

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/suprt/ITK-proj/pkg/proto
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../pkg/proto
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../pkg/proto
    opt: paths=source_relative